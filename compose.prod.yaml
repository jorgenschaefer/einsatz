name: einsatz

services:
  app:
    image: einsatz/app:latest
    pull_policy: never
    restart: unless-stopped
    build: .
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2816m
    memswap_limit: 2816m
    pids_limit: 256
    environment:
      - DATABASE_URL=$DATABASE_URL
      - ADMIN_USERNAME=$ADMIN_USERNAME
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - MAPTILER_API_KEY=$MAPTILER_API_KEY
    ports:
      - "127.0.0.1:3008:3000"
    networks:
      database_network:
      service_network:
        aliases:
          - einsatz
    volumes:
      - uploads:/data/uploads

networks:
  database_network:
    name: database_network
    external: true
  service_network:
    name: service_network
    external: true

volumes:
  uploads:
