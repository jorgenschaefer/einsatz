services:
  app:
    image: registry.drk-barmbek.de/einsatz/app:latest
    restart: always
    build: .
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2816m
    memswap_limit: 2816m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=$DATABASE_URL
      - ADMIN_USERNAME=$ADMIN_USERNAME
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - MAPTILER_API_KEY=$MAPTILER_API_KEY
      # Pflicht: sonst schreibt uploadsDir() nach /app/data/uploads am Volume vorbei.
      - UPLOADS_DIR=/data/uploads
    ports:
      - "127.0.0.1:3008:3000"
    networks:
      - database_network
    volumes:
      - uploads:/data/uploads

networks:
  database_network:
    external: true

volumes:
  uploads:
