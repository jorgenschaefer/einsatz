# Wegwerf-Datenbank für die Tests: Daten im RAM und ohne fsync – schnell, und
# ein Neustart räumt alles ab. Start: `docker compose -f docker-compose.test.yml up -d`
services:
  db-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: einsatz
      POSTGRES_PASSWORD: einsatz
      POSTGRES_DB: einsatz
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=300
    ports:
      - '127.0.0.1:5437:5432'
    tmpfs:
      - /var/lib/postgresql
