services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: einsatz
      POSTGRES_PASSWORD: einsatz
      POSTGRES_DB: einsatz
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U einsatz -d einsatz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
